name: Daily price check

on:
  schedule:
    - cron: "17 11 * * *"   # every day 11:17 UTC (06:17 New York, 22:17 Nouméa)
  workflow_dispatch: {}      # "Run workflow" button in the Actions tab

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: price-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Read every listing and compare with the last snapshot
        id: check
        run: node scripts/check-prices.js

      - name: Make sure the site still builds
        run: node build.js

      # Nothing that needs a human: save today's check dates and any price applied
      # automatically on main. Cloudflare Pages redeploys the site within a couple of minutes.
      - name: Save check dates and automatic price updates
        if: steps.check.outputs.changed != 'true'
        env:
          COMMIT_MSG: ${{ steps.check.outputs.commit_msg }}
        run: |
          git config user.name "price-check-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/check-status.json data/snapshots data/apps.json data/changelog.json
          if git diff --cached --quiet; then echo "Nothing to save"; exit 0; fi
          git commit -m "$COMMIT_MSG"
          git push

      # A change a price alone cannot express (new plan, new limit or fee, implausible price):
      # open a pull request with the snapshots and draft changelog entries. Nothing goes live
      # until it is reviewed and merged. Prices applied automatically in the same run ride along.
      - name: Open a pull request for the change
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: price-change/auto
          delete-branch: true
          commit-message: "Pricing change detected on a tracked listing"
          title: "Pricing change detected – review before publishing"
          body-path: price-report.md
          labels: price-change
          add-paths: |
            data/check-status.json
            data/snapshots/**
            data/changelog.json
            data/apps.json
